<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment | HealthPlus</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-50 font-[Poppins,sans-serif]">

  <!-- Navbar -->
  <header class="bg-white shadow-md py-4 fixed w-full top-0 z-10">
    <div class="container mx-auto flex justify-between items-center px-6">
      <h1 class="text-2xl font-bold text-blue-600"><i class="fa-solid fa-stethoscope"></i> HealthPlus</h1>
      <nav class="space-x-6 hidden md:flex">
        <a href="index.html" class="hover:text-blue-600">Home</a>
        <a href="appointments.html" class="text-blue-600 font-semibold">Appointments</a>
        <a href="records.html" class="hover:text-blue-600">Records</a>
        <a href="contact.html" class="hover:text-blue-600">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Appointment Booking -->
  <section class="pt-28 pb-16">
    <div class="max-w-4xl mx-auto bg-white p-10 rounded-2xl shadow-lg">
      <h2 class="text-3xl font-bold text-center text-blue-700 mb-6">Book an Appointment</h2>

      <form id="appointment-form" class="space-y-6">
        <!-- Patient Info -->
        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-gray-700 font-semibold mb-2"><i class="fa-solid fa-user"></i> Full Name</label>
            <input type="text" id="name" class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter your name" required>
          </div>
          <div>
            <label class="block text-gray-700 font-semibold mb-2"><i class="fa-solid fa-envelope"></i> Email</label>
            <input type="email" id="email" class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter your email" required>
          </div>
        </div>

        <!-- Doctor & Date -->
        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-gray-700 font-semibold mb-2"><i class="fa-solid fa-user-md"></i> Choose Doctor</label>
            <select id="doctor" class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none" required>
              <option value="">-- Select Doctor --</option>
              <option value="Dr. John Smith">Dr. John Smith - Cardiologist</option>
              <option value="Dr. Sarah Brown">Dr. Sarah Brown - Dermatologist</option>
              <option value="Dr. Alex Lee">Dr. Alex Lee - Pediatrician</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-700 font-semibold mb-2"><i class="fa-solid fa-calendar-days"></i> Date</label>
            <input type="date" id="date" class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none" required>
          </div>
        </div>

        <!-- Time Slot -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2"><i class="fa-solid fa-clock"></i> Time Slot</label>
          <select id="time" class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none" required>
            <option value="">-- Select Time --</option>
            <option>09:00 AM - 10:00 AM</option>
            <option>10:00 AM - 11:00 AM</option>
            <option>11:00 AM - 12:00 PM</option>
            <option>02:00 PM - 03:00 PM</option>
            <option>03:00 PM - 04:00 PM</option>
          </select>
        </div>

        <!-- Notes -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2"><i class="fa-solid fa-message"></i> Additional Notes</label>
          <textarea id="message" rows="4" class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Describe your symptoms..."></textarea>
        </div>

        <!-- Submit -->
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
          <i class="fa-solid fa-paper-plane"></i> Book Appointment
        </button>
      </form>

      <p id="success-message" class="text-green-600 font-semibold text-center mt-6 hidden">
        ✅ Appointment booked successfully!
      </p>
    </div>
  </section>

  <!-- View Appointments -->
  <section class="pb-20">
    <div class="max-w-5xl mx-auto bg-white p-8 rounded-2xl shadow-md">
      <h3 class="text-2xl font-bold text-blue-700 mb-4"><i class="fa-solid fa-calendar-check"></i> Your Appointments</h3>
      <div id="appointment-list" class="space-y-4"></div>
    </div>
  </section>

  <!-- JavaScript -->
  <script>
    const form = document.getElementById("appointment-form");
    const successMsg = document.getElementById("success-message");
    const appointmentList = document.getElementById("appointment-list");

    // Load saved appointments
    document.addEventListener("DOMContentLoaded", () => {
      const saved = JSON.parse(localStorage.getItem("appointments")) || [];
      saved.forEach(addAppointmentToList);
    });

    // Handle form submission
    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const appointment = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        doctor: document.getElementById("doctor").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        message: document.getElementById("message").value,
      };

      // Save to localStorage
      const appointments = JSON.parse(localStorage.getItem("appointments")) || [];
      appointments.push(appointment);
      localStorage.setItem("appointments", JSON.stringify(appointments));

      // Update UI
      addAppointmentToList(appointment);
      successMsg.classList.remove("hidden");
      form.reset();

      setTimeout(() => successMsg.classList.add("hidden"), 3000);
    });

    // Function to display appointment
    function addAppointmentToList(a) {
      const div = document.createElement("div");
      div.className = "p-5 border rounded-xl bg-gray-50 hover:bg-gray-100 transition";
      div.innerHTML = `
        <div class="flex justify-between items-center">
          <div>
            <h4 class="font-semibold text-blue-700 text-lg"><i class="fa-solid fa-user-md"></i> ${a.doctor}</h4>
            <p class="text-gray-700"><i class="fa-solid fa-user"></i> ${a.name} | <i class="fa-solid fa-envelope"></i> ${a.email}</p>
            <p class="text-gray-600 mt-1"><i class="fa-solid fa-calendar"></i> ${a.date} — ${a.time}</p>
            <p class="text-gray-500 italic mt-1">${a.message || "No additional notes"}</p>
          </div>
          <button class="text-red-500 hover:text-red-700 text-xl delete-btn"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;

      // Delete functionality
      div.querySelector(".delete-btn").addEventListener("click", () => {
        div.remove();
        deleteAppointment(a);
      });

      appointmentList.appendChild(div);
    }

    // Delete from localStorage
    function deleteAppointment(a) {
      let appointments = JSON.parse(localStorage.getItem("appointments")) || [];
      appointments = appointments.filter(
        item => !(item.name === a.name && item.date === a.date && item.time === a.time)
      );
      localStorage.setItem("appointments", JSON.stringify(appointments));
    }
  </script>
</body>
</html>
