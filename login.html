<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | HealthEase</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a2e0adf6d2.js" crossorigin="anonymous"></script>
</head>

<body class="bg-cover bg-center" style="background-image: url('images/health-bg.jpg');">
  <div class="bg-blue-900 bg-opacity-60 h-screen flex items-center justify-center">
    <div class="bg-white bg-opacity-95 p-10 rounded-2xl shadow-2xl w-full max-w-md text-center">
      <h2 class="text-3xl font-bold text-blue-700 mb-6">Welcome Back 👋</h2>
      <p class="text-gray-600 mb-8">Login to manage your health and appointments</p>

      <form class="space-y-6">
        <div class="flex items-center border-b-2 border-blue-200 focus-within:border-blue-600">
          <i class="fas fa-envelope text-blue-600 p-2"></i>
          <input type="email" placeholder="Email Address" class="w-full p-3 outline-none bg-transparent" required>
        </div>

        <div class="flex items-center border-b-2 border-blue-200 focus-within:border-blue-600">
          <i class="fas fa-lock text-blue-600 p-2"></i>
          <input type="password" placeholder="Password" class="w-full p-3 outline-none bg-transparent" required>
        </div>

        <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white py-3 rounded-lg font-semibold transition">
          Login
        </button>

        <div class="text-sm text-gray-600 mt-4">
          Don’t have an account?
          <a href="register.html" class="text-blue-600 hover:underline font-semibold">Register here</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
