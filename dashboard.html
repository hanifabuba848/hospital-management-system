<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | HealthEase</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a2e0adf6d2.js" crossorigin="anonymous"></script>
  <style>
    .dark-mode {
      background-color: #1a202c;
      color: #e2e8f0;
    }
    .dark-mode .bg-white { background-color: #2d3748; }
    .dark-mode .text-blue-800 { color: #63b3ed; }
    .dark-mode .text-gray-700 { color: #e2e8f0; }
    .dark-mode .text-gray-500 { color: #a0aec0; }
    .dark-mode .shadow { box-shadow: none; }
  </style>
</head>

<body class="bg-gray-100 font-[Poppins,sans-serif] transition-colors duration-300">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-blue-900 text-white flex flex-col justify-between transform md:translate-x-0 -translate-x-full transition-transform duration-300">
    <div>
      <div class="p-6 text-center border-b border-blue-700">
        <h1 class="text-2xl font-bold">🏥 HealthEase</h1>
      </div>
      <nav class="mt-6">
        <a href="#" class="flex items-center px-6 py-3 hover:bg-blue-800"><i class="fas fa-home mr-3"></i> Dashboard</a>
        <a href="appointment.html" class="flex items-center px-6 py-3 hover:bg-blue-800"><i class="fas fa-calendar-check mr-3"></i> Appointments</a>
        <a href="records.html" class="flex items-center px-6 py-3 hover:bg-blue-800"><i class="fas fa-notes-medical mr-3"></i> Health Records</a>
        <a href="chat.html" class="flex items-center px-6 py-3 hover:bg-blue-800"><i class="fas fa-envelope mr-3"></i> Messages</a>
        <a href="profile.html" class="flex items-center px-6 py-3 hover:bg-blue-800"><i class="fas fa-user-cog mr-3"></i> Profile</a>
      </nav>
    </div>
    <div class="p-6 border-t border-blue-700">
      <a href="login.html" class="flex items-center text-red-400 hover:text-red-500"><i class="fas fa-sign-out-alt mr-3"></i> Logout</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="md:ml-64 p-8 transition-all">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center space-x-3">
        <button id="menu-btn" class="md:hidden text-2xl text-blue-700"><i class="fas fa-bars"></i></button>
        <h2 class="text-3xl font-bold text-blue-800">Dashboard Overview</h2>
      </div>
      <div class="flex items-center space-x-4 relative">
        <i id="notif-btn" class="fas fa-bell text-blue-700 text-xl cursor-pointer"></i>

        <!-- Dark Mode Toggle -->
        <button id="theme-toggle" class="text-xl text-yellow-500 focus:outline-none">
          <i class="fas fa-moon"></i>
        </button>

        <!-- Notification Dropdown -->
        <div id="notif-box" class="hidden absolute right-0 top-8 bg-white shadow-lg rounded-lg w-64 p-4">
          <h4 class="font-semibold text-blue-700 mb-2">Notifications</h4>
          <ul id="notif-list" class="space-y-2 text-sm text-gray-600">
            <li>New appointment booked</li>
            <li>Lab results ready</li>
          </ul>
        </div>

        <div class="flex items-center space-x-3">
          <img src="images/user-avatar.jpg" alt="User" class="w-10 h-10 rounded-full border-2 border-blue-700">
          <span class="font-semibold text-gray-700">Dr. Jane Smith</span>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid md:grid-cols-3 gap-6 mb-10">
      <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
        <div class="flex justify-between items-center">
          <div>
            <h4 class="text-gray-500">Appointments</h4>
            <p id="stat-appointments" class="text-3xl font-bold text-blue-700">0</p>
          </div>
          <i class="fas fa-calendar-check text-blue-600 text-3xl"></i>
        </div>
      </div>

      <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
        <div class="flex justify-between items-center">
          <div>
            <h4 class="text-gray-500">Patients</h4>
            <p id="stat-patients" class="text-3xl font-bold text-green-600">0</p>
          </div>
          <i class="fas fa-user-injured text-green-500 text-3xl"></i>
        </div>
      </div>

      <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
        <div class="flex justify-between items-center">
          <div>
            <h4 class="text-gray-500">Messages</h4>
            <p id="stat-messages" class="text-3xl font-bold text-yellow-600">0</p>
          </div>
          <i class="fas fa-envelope text-yellow-500 text-3xl"></i>
        </div>
      </div>
    </div>

    <!-- Appointments Table -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h3 class="text-2xl font-bold text-blue-800 mb-4">Recent Appointments</h3>
      <table class="w-full text-left">
        <thead>
          <tr class="border-b">
            <th class="pb-2">Patient</th>
            <th class="pb-2">Date</th>
            <th class="pb-2">Time</th>
            <th class="pb-2">Status</th>
          </tr>
        </thead>
        <tbody id="appointment-table"></tbody>
      </table>
    </div>
  </main>

  <script>
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const notifBtn = document.getElementById('notif-btn');
    const notifBox = document.getElementById('notif-box');
    const themeToggle = document.getElementById('theme-toggle');

    // Sidebar Toggle
    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
    });

    // Notification Toggle
    notifBtn.addEventListener('click', () => {
      notifBox.classList.toggle('hidden');
    });

    // Dummy Data
    const appointments = [
      { patient: "John Doe", date: "20 Oct 2025", time: "10:00 AM", status: "Confirmed" },
      { patient: "Mary Johnson", date: "21 Oct 2025", time: "2:30 PM", status: "Pending" },
      { patient: "David Kim", date: "22 Oct 2025", time: "11:00 AM", status: "Cancelled" },
      { patient: "Sarah Lee", date: "23 Oct 2025", time: "9:00 AM", status: "Confirmed" }
    ];

    // Render Appointments
    const table = document.getElementById('appointment-table');
    appointments.forEach(app => {
      const row = document.createElement('tr');
      row.className = "border-b hover:bg-gray-50";
      row.innerHTML = `
        <td>${app.patient}</td>
        <td>${app.date}</td>
        <td>${app.time}</td>
        <td><span class="font-semibold ${
          app.status === 'Confirmed' ? 'text-green-600' :
          app.status === 'Pending' ? 'text-yellow-600' : 'text-red-600'
        }">${app.status}</span></td>
      `;
      table.appendChild(row);
    });

    document.getElementById('stat-appointments').textContent = appointments.length;
    document.getElementById('stat-patients').textContent = 58;
    document.getElementById('stat-messages').textContent = 5;

    // Simulate real-time notifications
    setInterval(() => {
      const notifList = document.getElementById('notif-list');
      const now = new Date().toLocaleTimeString();
      const li = document.createElement('li');
      li.textContent = `New system check at ${now}`;
      notifList.appendChild(li);
      if (notifList.children.length > 5) notifList.removeChild(notifList.firstChild);
    }, 5000);

    // 🌙 DARK MODE TOGGLE (with persistence)
    const body = document.body;
    function setTheme(dark) {
      if (dark) {
        body.classList.add('dark-mode');
        themeToggle.innerHTML = '<i class="fas fa-sun text-yellow-400"></i>';
        localStorage.setItem('theme', 'dark');
      } else {
        body.classList.remove('dark-mode');
        themeToggle.innerHTML = '<i class="fas fa-moon text-gray-700"></i>';
        localStorage.setItem('theme', 'light');
      }
    }

    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    setTheme(savedTheme === 'dark');

    themeToggle.addEventListener('click', () => {
      const dark = !body.classList.contains('dark-mode');
      setTheme(dark);
    });
  </script>
</body>
</html>
